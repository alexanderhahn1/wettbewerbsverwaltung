apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: leocloud-nginx
spec:
  ingressClassName: nginx
  rules:
  - host: it210182.cloud.htl-leonding.ac.at
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: wettbewerbs-backend
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wettbewerbs-frontend
            port:
              number: 80