version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: wettbewerb-database
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports:
      - "5423:5432"  # host:container
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./../backend
    container_name: wettbewerbs-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/demo
      QUARKUS_DATASOURCE_USERNAME: demo
      QUARKUS_DATASOURCE_PASSWORD: demo
    ports:
      - "8080:8080"
    networks:
      - backend

  frontend:
    build:
      context: ./../frontend
    container_name: wettbewerbs-frontend
    ports:
      - "4200:80"  # Host port 4200 maps to nginx's port 80
    networks:
      - backend

networks:
  backend:
