<div class="flex items-center justify-center min-h-screen bg-gray-50 border-b-gray-500">
  <div class="w-full max-w-sm space-y-6 border border-gray-300 rounded-lg p-6 shadow-sm bg-white">
    <div>
      <label for="username" class="block text-sm font-medium text-gray-900">Username</label>
      <input
        type="text"
        name="username"
        id="username"
        placeholder="Username"
        class="mt-2 block w-full rounded-md border border-gray-300 py-1.5 pl-3 pr-3 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:border-indigo-600"
      />
    </div>

    <div>
      <label for="password" class="block text-sm font-medium text-gray-900">Password</label>
      <input
        type="password"
        name="password"
        id="password"
        placeholder="Password"
        class="mt-2 block w-full rounded-md border border-gray-300 py-1.5 pl-3 pr-3 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:border-indigo-600"
      />
    </div>
    <div>
      <button
        type="submit"
        class="w-full mt-4 rounded-md bg-indigo-600 py-2 px-4 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:ring-offset-1"
      >
        Login
      </button>
    </div>
  </div>
</div>
