<app-submission-filter-bar></app-submission-filter-bar>
<div class="grid grid-cols-1 sm:grid-cols-1 lg:grid-cols-1 gap-6 px-4 py-6">
  @for (submission of submissions; track submission.name) {
    <app-submission-card [submission]="submission"></app-submission-card>
  }
  @if (submissions.length == 0) {
    <p>Es wurde kein Wettbewerb mit diesem Name gefunden!</p>
  }
</div>
