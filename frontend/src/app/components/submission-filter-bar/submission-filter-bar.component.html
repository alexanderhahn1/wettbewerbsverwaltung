<div class="max-w-xl mx-auto p-6 bg-white rounded-lg shadow-md mt-5">
  <label class="block text-sm font-medium text-gray-700">Nach Schuljahr:</label>
  <div class="flex flex-wrap gap-4 items-center">
    <label class="flex items-center gap-2 text-sm text-gray-700">
      <input
        type="radio"
        name="schoolYear"
        value="all"
        [(ngModel)]="selectedSchoolYear"
        class="h-4 w-4 text-blue-600 border-gray-300 focus:ring-blue-500"
        (click)="selectSchoolYear('')"
      />
      <span>Alle</span>
    </label>

    @for (year of schoolYears; track year) {
      <label class="flex items-center gap-2 text-sm text-gray-700">
        <input
          type="radio"
          name="schoolYear"
          value="{{year}}"
          [(ngModel)]="selectedSchoolYear"
          class="h-4 w-4 text-blue-600 border-gray-300 focus:ring-blue-500"
          (click)="selectSchoolYear(year)"
        />
        <span>{{ year | formatSchoolYear}}</span>
      </label>
    }
  </div>
</div>
