<div class="w-full max-w-4xl min-w-[30vw] mx-auto rounded-lg border border-gray-300 bg-white p-4 sm:p-6 shadow-sm">
  <h2 class="text-lg font-semibold text-gray-900">{{ submission.name }}</h2>
  <p class="italic text-sm text-gray-600 mb-4">letztes Update: {{ submission.last_update }}</p>

  @if (submission.projects.length > 0) {
    <div class="overflow-x-auto">
      @for (project of submission.projects; track project.name) {
        <app-submission-project-item [project]="project" class="pt-4 border-t border-gray-200"></app-submission-project-item>
      }
    </div>
  } @else {
    <p class="mt-4 text-sm text-gray-700 italic bg-yellow-50 border border-yellow-200 rounded-md p-4">
      Hier gibt es noch keine Projekte – vielleicht möchtest du den Anfang machen?
    </p>
  }
</div>
